<h1>例子库 · 逻辑与条件充分性攻坚</h1>
<p class="sub">左半是写作：<b>23 个能回正分论点的例子</b>（历史 / 哲学 / AI / 企业各 5–6 个），每个都写清「事实—回扣句—反向用法—适配题目—别这么用」。<br>右半是客观题：<b>把 5 选 1 收成 2 选 1</b> 的正向五步 + 逆向六条，以及条件充分性 A–E 的判定顺序。</p>

<div class="bar" id="tabs">
  <button data-t="ex" class="on">① 例子库</button>
  <button data-t="fit">② 题目适配</button>

  <button data-t="map">⑤ 20 之外</button>
</div>

<main id="view"></main>

<p class="note" style="margin-top:22px">
事实口径：例子里的时间与数字按公开报道整理到 2025 年底，凡标「据公开报道」的都建议你在用之前自己再核一遍——考场上写错一个数字，比不写例子更亏。
2026 真题与最新 AI 动态属于近一年事件，写进作文时用「据报道」「2024 年前后」这类限定词，比精确到月更安全。
</p>

    '<div class="okbox"><b>例子三句话公式：</b>① 事实（谁 · 什么时候 · 做了什么，一句话）→ ② 转折（结果与预期相反的那一下）→ ③ <b>回扣（把例子重新接回分论点的名词）</b>。<br>'+
    '缺第 ③ 句，例子就是「贴上去的」；第 ③ 句里必须出现分论点里的那个词，否则阅卷人看得出你在硬塞。</div></div>';
  G.forEach(function(g, gi){
    h += '<div class="card"><h2 style="margin-top:0">'+g.t+' <span class="note" style="font-weight:400">· '+g.items.length+' 例</span></h2>'+
      '<div class="note" style="margin-bottom:8px">'+g.note+'</div>';

        '<span class="nm">'+e.nm+'</span><span class="tag">'+e.tag+'</span></div>'+
        '<p><span class="lab l-fact">事实</span>'+e.fact+'</p>'+
        '<p><span class="lab l-back">回扣句</span>'+e.back+'</p>'+
        '<p><span class="lab l-rev">反向用法</span>'+e.rev+'</p>'+
        '<p><span class="lab l-fit">适配</span>'+e.fit+'</p>'+
        '<p><span class="lab l-bad">别这么用</span>'+e.bad+'</p></div>';
    });
    h += '</div>';
  });
  h += '<div class="card"><h3 style="margin-top:0">四种回扣句模板（照这个骨架写，就不会「例子贴上去」）</h3>'+
    '<table class="tbl"><tr><th style="width:26%">模板</th><th>骨架</th><th style="width:30%">用在哪种段落</th></tr>'+
    '<tr><td>同构读法</td><td>「可见，X 的胜负不在 <b>A</b>，而在 <b>B</b>。」</td><td>把例子读成论点的同构：正段</td></tr>'+
    '<tr><td>方向错配</td><td>「X 不是没有 <b>A</b>，而是把 <b>A</b> 用错了方向。」</td><td>例子看起来是反例、要救回来时</td></tr>'+
    '<tr><td>反事实收尾</td><td>「如果 X 当年 <b>不做那一步</b>，就不会有后来的 <b>Y</b>。」</td><td>强调「缺了它就失效」：正段或反段</td></tr>'+
    '<tr><td>定义落地</td><td>「这也正是「<b>分论点原词</b>」四个字的具体含义。」</td><td>合段前一句，把抽象词钉在事实上</td></tr></table>'+
    '<div class="warnbox"><b>为什么你觉得「用意」想不出来：</b>不是缺素材，是缺「把例子折回判断」的那一句动作。练习方法很笨但有效——写完例子后，强制自己用上面四个模板中的任意一个补一句，'+
    '并且<b>这一句里必须出现分论点的原词</b>（定力 / 边界 / 担责 / 供养）。一天练 3 个例子，一周就不卡了。</div></div>';
  return h;
};

/* ================= ③ 逻辑技巧 ================= */
TABS.logic = function(){
  var h = '<div class="card"><span class="qtag">逻辑技巧</span>'+
    '<p style="margin:10px 0 6px"><b>你的方向没理解错，但可以更狠一点。</b>你说的是「正向抓重点 + 逆向排除」，'+
    '我把它写成三步收窄，目标是把 5 选 1 变成 <b>2 选 1</b>：</p>'+
    '<div class="okbox"><b>题型收窄（7 类）→ 缺口收窄（1 个动作）→ 选项收窄（划掉 3 个）。</b><br>'+
    '前两步决定「你在找什么」，第三步决定「你不看什么」。缺任何一步，都会变成「四个选项都像对」。</div></div>';

  h += '<div class="card"><h2 style="margin-top:0">一、正向五步（30–40 秒完成，别超时）</h2>'+
   '<div class="step"><div class="n">1</div><div class="b"><b>只读问法，先判题型。</b>「最能支持 / 削弱 / 必须假设 / 能推出 / 最能解释 / 论证方式相似 / 除……之外」——七个词各对应一个动作，混了就会用错打法。</div></div>'+
   '<div class="step"><div class="n">2</div><div class="b"><b>圈论点句。</b>找含「因此 / 所以 / 可见 / 说明 / 表明」的那一句；没有连接词，就找含「应当 / 必须 / 应该」的规范句。论点句永远是<b>结论</b>，不是背景。</div></div>'+
   '<div class="step"><div class="n">3</div><div class="b"><b>画箭头。</b>若 A 则 B → <code>A→B</code>；只有 A 才 B → <code>B→A</code>（倒过来！）；除非 A 否则 B → <code>¬A→B</code>；没有 A 就没有 B → <code>¬A→¬B</code>。题干一长，先只抄箭头，不抄形容词。</div></div>'+
   '<div class="step"><div class="n">4</div><div class="b"><b>找缺口。</b>支持＝补前提与结论之间缺的那环；削弱＝打断那一环（<b>量化否定</b>优于「可能有风险」）；假设＝把选项取反代回题干，看结论是否塌。</div></div>'+
   '<div class="step"><div class="n">5</div><div class="b"><b>只看动缺口的那一个选项。</b>剩下的哪怕「说得对」，只要不动缺口，就是无关项。</div></div>'+
   '<div class="note">省时口诀：<b>问法定动作，连接词定结论，箭头定缺口，取反定假设。</b></div></div>';

  h += '<div class="card"><h2 style="margin-top:0">二、逆向六条排除（这一步才是提速的关键）</h2>'+
   '<table class="tbl"><tr><th style="width:24%">看到什么</th><th>怎么处理</th><th style="width:26%">常出现在</th></tr>'+
   '<tr><td>所有 / 一定 / 必然 / 唯一 / 只要</td><td>先验后否：带绝对词的选项默认高危，除非题干本身是定义</td><td>削弱、结论推出</td></tr>'+
   '<tr><td>换了主体（人 / 时间 / 范围 / 行业）</td><td>直接划掉，这是「无关项」，不是「弱项」</td><td>支持、削弱</td></tr>'+
   '<tr><td>只是重复题干前提</td><td>划掉：重复前提不推进结论</td><td>支持、假设</td></tr>'+
   '<tr><td>诉诸权威 / 多数 / 情感 / 专家说</td><td>划掉：不是论证</td><td>支持、削弱</td></tr>'+
   '<tr><td>出现比较级但题干没给基准</td><td>划掉：不可比</td><td>结论推出、解释</td></tr>'+
   '<tr><td>「可能 / 或许 / 部分」的弱表述</td><td>在削弱题里通常不够（要量化否定）；在结论题里反而常是正确答案</td><td>两类相反，注意别记反</td></tr></table></div>';

  h += '<div class="card"><h2 style="margin-top:0">三、三个会让你「搞脑子」的陷阱</h2>'+
   '<ul class="tight">'+
   '<li><b>必要条件当充分。</b>「只有 A 才 B」写成 <code>B→A</code>，所以有 A 推不出 B。<b>看到「只有…才」先在草稿上画个反向箭头。</b></li>'+
   '<li><b>否定前件 / 肯定后件。</b><code>A→B</code> 只能推出 <code>¬B→¬A</code>；写成 <code>¬A→¬B</code> 或 <code>B→A</code> 都是错的。选项里出现这两种，立刻划。</li>'+
   '<li><b>范围漂移。</b>题干说「某类企业」，选项说「企业」；题干说「这一批样本」，选项说「所有人」。<b>读选项时用手指着一个字一个字比对量词。</b></li></ul>'+
   '<div class="warnbox">如果一道题你读了两遍还在「都觉得对」，说明你还在<b>读内容</b>，没在读<b>结构</b>。退回去做第二步：把论点句抄成一句话，再看选项——90% 的纠结会消失。</div></div>';

  h += '<div class="card"><h2 style="margin-top:0">四、你点名的三类题，各有模板</h2>'+
   '<h3>A · 几个人里选几个（匹配 / 分组）</h3>'+
   '<ul class="tight">'+
   '<li><b>先画格子</b>：人 × 物（或人 × 组）的二维表，条件逐条填成「√ / × / ？」。</li>'+
   '<li><b>先填死条件</b>：出现「一定 / 必然 / 不能」的先落到格子里，它是硬约束；「可能 / 或者」先放着。</li>'+
   '<li><b>再用「每类至少一个 / 恰好几个」当计数器</b>：数不够就整行排除，这一招比推条件快得多。</li>'+
   '<li>最后才用排除法验选项：<b>把选项代进格子</b>，一代就矛盾的直接划。</li></ul>'+
   '<h3>B · 各种「若…则…」（形式逻辑）</h3>'+
   '<ul class="tight">'+
   '<li>全部符号化，<b>形容词一律丢掉</b>（「优秀的企业」就写 E）。</li>'+
   '<li>找<b>逆否</b>：<code>A→B</code> 等价 <code>¬B→¬A</code>，题干的逆否往往就是答案。</li>'+
   '<li>多条箭头<b>首尾相连</b>：A→B、B→C，得 A→C；中间那条往往是正确选项藏身处。</li>'+
   '<li>「只有…才」「除非…否则」先翻译成箭头再连，别用中文硬想。</li></ul>'+
   '<h3>C · 谁比谁高（比较 / 排序）</h3>'+
   '<ul class="tight">'+
   '<li>只画<b>一条数轴</b>，每给一个「A 比 B 高」就在轴上挪格子，不写文字。</li>'+
   '<li>「不能确定」只在<b>两端还空着</b>时成立；一旦两端被填满，就一定确定。</li>'+
   '<li>出现等号（「不低于 / 不比…差」）要单独标，等号最容易让整题翻车。</li></ul>'+
   '<h3>D · 一道材料两个小题（一拖二）</h3>'+
   '<ul class="tight">'+
   '<li><b>先做「可能为真」那题</b>（范围大，好排除），再做「一定为真」那题（范围小，靠推导）。顺序反了会白耗时间。</li>'+
   '<li>第二小题未必沿用第一小题的临时假设，<b>先看题干有没有说「共用条件」</b>。</li>'+
   '<li>两小题都做不出来时，先猜<b>「一定为真」那题选带前提的选项</b>，命中率比瞎选高。</li></ul>'+
   '<div class="okbox">时间纪律：单题 <b>90 秒</b>，超过就标记跳过。逻辑 30 题里，一拖四的两组共 16 题（48 分）是另一个物种，'+
   '别和论证题混着练——论证题考「找缺口」，分析推理考「填表格」，练法完全不同。</div></div>';
  return h;
};

/* ================= ④ 条件充分性 ================= */
TABS.cs = function(){
  var h = '<div class="card"><span class="qtag">条件充分性判断</span>'+
    '<p style="margin:10px 0 6px"><b>先纠一个数：</b>它 10 题 × 3 分 = <b>30 分</b>，不是 8 分。但更重要的一个数是——'+
    '按我们 2026 卷的分档，这 10 题里<b>只有 1 题必拿（25 题）、4 题可选、5 题该跳</b>。所以它不是「题型」，是套在 10 个考点外面的<b>一层判定规则</b>：'+
    '先把内容考点认出来（M1–M10），再套五种选项的顺序。</p>'+
    '<div class="warnbox"><b>最大的浪费：一上来就联立。</b>哪怕你联立解出来了，也判不出 A/B/D——三个选项直接丢掉。'+
    '<b>纪律：先单独试条件 1，再单独试条件 2，最后才许联立。</b></div></div>';

  h += '<div class="card"><h2 style="margin-top:0">一、五种选项，一句话记住</h2>'+
   '<table class="tbl"><tr><th style="width:12%">选项</th><th>含义</th><th style="width:34%">判定动作</th></tr>'+
   '<tr><td><b>A</b></td><td>条件 1 单独充分，条件 2 单独不充分</td><td>1 能推出结论；2 能找到反例</td></tr>'+
   '<tr><td><b>B</b></td><td>条件 2 单独充分，条件 1 单独不充分</td><td>反过来一遍</td></tr>'+
   '<tr><td><b>C</b></td><td>单独都不充分，<b>联合</b>才充分</td><td>两个都找到反例 → 再合起来试</td></tr>'+
   '<tr><td><b>D</b></td><td>各自都充分</td><td>两个都能单独推出结论</td></tr>'+
   '<tr><td><b>E</b></td><td>联合也不充分</td><td>联立后仍能找到反例</td></tr></table>'+
   '<div class="note">一句话：<b>A / B 是「一边够」，C 是「合起来才够」，D 是「两边都够」，E 是「怎么都不够」。</b></div></div>';

  h += '<div class="card"><h2 style="margin-top:0">二、省时间的判定顺序（照这个顺序走，别改）</h2>'+
   '<div class="step"><div class="n">1</div><div class="b"><b>只带条件 1，去举反例。</b>反例优先取三类值：<code>0</code>、<code>1/2</code>、<b>边界值</b>（等号处）、<b>负数</b>。<br>举到 → 条件 1 不充分，直接进第 2 步；举不到 → 先别急着判充分，进第 2 步交叉验证。</div></div>'+
   '<div class="step"><div class="n">2</div><div class="b"><b>只带条件 2，同样举反例。</b>这一步是分清 A 与 B 的唯一机会。</div></div>'+
   '<div class="step"><div class="n">3</div><div class="b"><b>两个都不充分 → 才联合。</b>联立后<b>再举一次反例</b>，举不到才是 C。</div></div>'+
   '<div class="step"><div class="n">4</div><div class="b"><b>联合仍能举反例 → E。</b>注意：E 的常见来源是「两个条件说的是同一件事」，联立等于没加信息。</div></div>'+
   '<div class="okbox"><b>三个动作比推导快：</b>① <b>特殊值</b>（0 / 1 / 2 / -1 / 边界）② <b>极端化</b>（把参数推到相等或无穷）③ <b>图形化</b>（解析几何与不等式题画出来直接看解集区间）。'+
   '能用特殊值判掉的，绝不动笔推导。</div></div>';

  h += '<div class="card"><h2 style="margin-top:0">三、什么时候该直接跳（C 档特征）</h2>'+
   '<table class="tbl"><tr><th style="width:44%">题目长相</th><th>为什么该跳</th></tr>'+
   '<tr><td>出现两个绝对值 / 分类讨论多于 2 支</td><td>分支数按指数涨，5 分钟内做不完（2026 第 18 题就是这型）</td></tr>'+
   '<tr><td>加权平均但<b>权重没给</b></td><td>权重自由 → 结论不确定，这型常常是「永远定不出来」，白想（第 22 题）</td></tr>'+
   '<tr><td>抛物线与坐标轴围面积 + 参数</td><td>要联立 + 韦达 + 面积公式，链路长（第 23 题）</td></tr>'+
   '<tr><td>两个条件互为「同一件事的不同说法」</td><td>联立无新增信息，基本是 E，可直接选</td></tr></table>'+
   '<div class="warnbox"><b>反过来说：</b>出现「直线过定点」要先提参数（第 25 题，唯一必拿）；出现「比例 + 整数解」要盯整除性（第 16 题）。'+
   '这两型是条件充分性里最稳定的送分口。</div></div>';

  h += '<div class="card"><h2 style="margin-top:0">四、我的建议：单开模块，但按「分值账」开</h2>'+
   '<p style="margin:6px 0">你说的「单开一个模块」我赞成，但别叫「8 分模块」，也对不上你的一三分之一：</p>'+
   '<table class="tbl"><tr><th style="width:34%">模块（建议名）</th><th style="width:16%">题量 / 分值</th><th>里面装什么</th></tr>'+
   '<tr><td><b>攻坚 · 分析推理</b></td><td>16 题 / 48 分</td><td>一拖四：排位、匹配、排期、分组；四个子型各一套模板（画格子 → 填死条件 → 计数器 → 代选项）</td></tr>'+
   '<tr><td><b>攻坚 · 论证逻辑</b></td><td>12 题 / 36 分</td><td>支持 / 削弱 / 假设 / 除外：正向五步 + 逆向六条；重点是「缺口」位置</td></tr>'+
   '<tr><td><b>攻坚 · 条件充分性</b></td><td>10 题 / 30 分<br><span class="note">必拿 3 + 可选 12 + 该跳 15</span></td><td>不按题型讲，按<b>判定规则</b>讲：五选项顺序 + 反例优先 + 三类该跳特征</td></tr>'+
   '<tr><td><b>攻坚 · 数学 C 档</b></td><td>5–6 题</td><td>绝对值分类、隐含权重、围面积、多分支二次函数；只讲「怎么在 40 秒内认出来并放弃」</td></tr></table>'+
   '<div class="okbox"><b>为什么建议这样切：</b>你现在缺的不是「更多题型」，而是<b>三类不同物种的分开练</b>——论证题练「找缺口」、分析推理练「填表格」、条件充分性练「判定顺序」。'+
   '混在一起练，就会出现你说的「陷入搞脑子的逻辑谬误」：因为你在用同一套直觉去解三种结构的题。</div>'+
   '<p class="note" style="margin-top:10px">要做的话，我可以照现在这几个页面的做法，把它做成一个单文件页：左边是「题型卡 + 模板」，右边是「10 秒识别训练」（给题干，只点题型和缺口位置，不让你算）。'+
   '要做哪个模块先？</p></div>';
  return h;
};

/* ================= ⑤ 20 之外 ================= */
TABS.map = function(){
  var h = '<div class="card"><span class="qtag">考点地图</span>'+
    '<p style="margin:10px 0 6px"><b>直接回答：20 个必考点之外，没有「新题型」，只有三样东西。</b>'+
    '我把知识库里 44 个考点按层拆开给你看，你会发现问题不在「还有没有别的考点」，而在「有 24 张动作卡没被单独练过」。</p></div>';

    '<tr><th style="width:22%">层</th><th style="width:14%">数量</th><th>是什么</th></tr>'+
    '<tr><td><b>第 1 层：必考点</b></td><td>20 个</td><td>数学 M1–M10（应用题 2 / 几何 2 / 解析几何 / 方程判别式 / 数列 / 不等式最值 / 函数性质 / 概率）＋ 逻辑 L1–L10（支持 / 削弱 / 假设 / 前提 / 结论 / 解释 / 相似 / 除外 / 分析推理 / 只有才）</td></tr>'+
    '<tr><td><b>第 2 层：动作卡</b></td><td>24 张</td><td>必考点<b>内部</b>的具体动作，不是新题型。例：判别式、韦达、数卦限、三切 1:√2:√3、圆与正方形 π/4 vs 2/π、容斥、裂项、提参数过定点、Sₙ 作差、绝对值符号、穿针引线、齐次化、隐含权重、整除性、标数法、样本空间、两条互斥路径、周期奇偶、取整分组、相遇速度比、总量为 1、只算溶质、代数式翻译成距离、抛物线代点</td></tr>'+
    '<tr><td><b>第 3 层：判定规则</b></td><td>1 套</td><td>条件充分性 A–E 的判定顺序（M0）——它不是考点，是套在 10 个考点外面的壳</td></tr>'+
    '<tr><td><b>第 4 层：句式变体</b></td><td>5 类</td><td>「只有…才」「除非…否则」「没有…就没有」「A 是 B 的必要条件」「不 A 不 B」——都属于 L10，但翻译规则各不相同</td></tr>'+

    '<div class="note">数据来源：<code>_data/knowledge.json</code>（44 个考点＝数学 34 + 逻辑 10）与 <code>08-必考点20.md</code>（数学由 29 个原始考点合并为 10）。</div></div>';

  h += '<div class="card"><h3 style="margin-top:0">所以你真正缺的，是这三件事（都不是「新考点」）</h3>'+
   '<ul class="tight">'+
   '<li><b>24 张动作卡没有单独练。</b>它们分散在 10 个必考点里，平时是「做题时顺手用」，没有一次「只练这个动作」的专项——所以考场上想不起来用齐次化、标数法、提参数。</li>'+
   '<li><b>判定规则没有独立成块。</b>条件充分性被当成「难题」而不是「顺序题」，导致每次都在推导上耗，而不是在「先单独试 1」上省。</li>'+
   '<li><b>三种物种混练。</b>论证（找缺口）、分析推理（填表格）、条件充分性（判定顺序）需要三套不同的输入输出，混练就会互相污染。</li></ul>'+
   '<div class="okbox"><b>建议的练法（和 20 必考点并行，不替代）：</b>每天 15 分钟「10 秒识别」——只给题干，让你点出①题型②缺口位置/表格类型③这题该不该跳。不让你算。'+
   '一周下来，识别的速度会比刷题快得多，而且不会占掉刷题的时间。</div></div>';

  h += '<div class="card"><h3 style="margin-top:0">接下来可以点单的四件事</h3>'+
   '<table class="tbl"><tr><th style="width:34%">要做的</th><th>我能交付的东西</th><th style="width:14%">工作量</th></tr>'+
   '<tr><td>攻坚 · 分析推理（16 题 48 分）</td><td>四子型模板卡 + 30 道「只识别不计算」的 10 秒训练题</td><td>大</td></tr>'+
   '<tr><td>攻坚 · 条件充分性（30 分）</td><td>判定顺序卡 + 2026 十题逐题演示「哪一步可以省」+ 20 道反例优先练习</td><td>中</td></tr>'+
   '<tr><td>24 张动作卡</td><td>每卡：一句触发词 + 一个动作 + 一道最小例题（可做成考点识别页的一个新分栏）</td><td>中大</td></tr>'+
   '<tr><td>写作例子再扩</td><td>把 2019–2025 真题题干按「题目适配」格式补进去（需要你贴题干）</td><td>小（题干给我就行）</td></tr></table>'+
   '<p class="note" style="margin-top:8px">如果只能先做一个，我建议先做<b>分析推理</b>——48 分最大，而且它和你说的「选几个人 / 若则 / 比大小」正好重合，练感也最明显。</p></div>';
  return h;
};

/* ================= 切换 ================= */
var view = document.getElementById('view');
var cur = 'ex';
function setTab(t){
  cur = t;
  [].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){
    b.classList.toggle('on', b.dataset.t === t);
  });
  view.innerHTML = (TABS[t] || TABS.ex)();
  window.scrollTo(0, 0);
}
[].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){
  b.onclick = function(){ setTab(b.dataset.t); };
