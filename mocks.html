function table(list, title){
 var is3 = (list === A3);
 var h='<h3 style="margin:10px 0 6px">'+title+'</h3>';
 h+='<table class="tbl"><tr><th style="width:6%">题</th><th style="width:22%">考点</th><th style="width:7%">档</th><th style="width:11%">我推</th><th>动作</th>'+ (is3?'<th style="width:11%">拆解</th>':'') +'</tr>';
 h+=list.map(function(r){
   var has = is3 && DRILL3.some(function(d){return d.n===r.n;});
   return '<tr><td><b>'+r.n+'</b></td><td>'+r.kp+'</td><td><span class="pill t'+r.t+'">'+r.t+'</span></td><td>'+r.ans+'</td><td>'+r.act+'</td>'+
     (is3?('<td>'+(has?'<button class="btn" data-drill="'+r.n+'" style="padding:3px 10px;font-size:12.5px">拆</button>':'')+'</td>'):'')+
     '</tr>';
 }).join('');
 h+='</table>';
 return h;
}

var DS={cur:0,res:{},easy:false};
try{ var d0=localStorage.getItem('kaoyan.mocks.drill'); if(d0){ var o0=JSON.parse(d0); DS.cur=o0.cur||0; DS.res=o0.res||{}; } }catch(e){}
function saveD(){ try{ localStorage.setItem('kaoyan.mocks.drill', JSON.stringify({cur:DS.cur,res:DS.res})); }catch(e){} }

function ezBox(st){
  if(!st.ez) return '';
  var e=st.ez;
  return '<div class="ezbox">'+
   (e.k?'<div class="ez-row ez-key"><b>关键</b><div>'+e.k+'</div></div>':'')+
   (e.s?'<div class="ez-row ez-kill"><b>秒杀</b><div>'+e.s+'</div></div>':'')+
   (e.t?'<div class="ez-row ez-trap"><b>陷阱</b><div>'+e.t+'</div></div>':'')+
   (e.p&&e.p.length?'<div class="ez-row ez-kp"><b>考点</b><div>'+e.p.map(function(x){return '<span class="kptag">'+x+'</span>';}).join('')+'</div></div>':'')+
   '</div>';
}

TABS.drill=function(){
  var q=DRILL3[DS.cur]||DRILL3[0];
  var html='<div class="card"><span class="qtag">A3 拆题</span>'+
   '<p class="note" style="margin:8px 0 0">第一步不问你考点名字，只问<b>「这题要你干什么」</b>——用大白话选。答完最后一步，会展开完整怎么算的。</p><p class="note" style="margin:6px 0 0"><b>训练集：2A / 3A</b>（现在练）｜<b>测试集：2B</b>（等你拍）。2A 的题干还没录入，暂时只有 3A 的 19 题可以点开做。</p>'+
   '<div class="bar mini" style="margin:10px 0 0" id="dpick">'+DRILL3.map(function(it,i){
     var done=it.steps.filter(function(st,j){return DS.res['q'+it.n+'-'+j]===1;}).length;
     return '<button data-i="'+i+'" class="'+(i===DS.cur?'on':'')+'">'+it.n+' 题'+'<br><span class="note">'+done+'/'+it.steps.length+'</span></button>';
   }).join('')+'</div></div>';
  html+='<div class="card"><div class="note">A3 第 '+q.n+' 题 · '+q.kp+' · '+q.tier+' 档</div>'+
   '<div class="material" style="white-space:pre-wrap;margin-top:8px">'+q.stem+'</div>'+
   '<div class="note">选项：'+q.opts.map(function(o,i){return 'ABCDE'.charAt(i)+'. '+o;}).join('　')+'</div>'+(DS.easy?ezBox(q):'')+'</div>';
  html+='<div id="dsteps"></div>';
  view.innerHTML=html;
  [].slice.call(document.querySelectorAll('#dpick button')).forEach(function(b){
    b.onclick=function(){ DS.cur=+b.dataset.i; saveD(); setTab('drill'); };
  });
  var box=document.getElementById('dsteps');
  q.steps.forEach(function(st,j){ box.appendChild(dStep(q,st,j)); });
};

function dStep(q,st,j){
  var key='q'+q.n+'-'+j, rec=DS.res[key];
  var answered=(rec!=null), picked=answered?(rec>1?rec-100:st.right):null, ok=answered&&rec===1;
  var d=document.createElement('div'); d.className='step'+(ok?' done':'');
  var head='<div class="stephd"><span class="stepno">'+(j+1)+'</span><span>'+st.name+'</span>'+
    (ok?'<span style="color:var(--ok);font-weight:700">✓</span>':(answered?'<span style="color:var(--warn);font-weight:700">✗ 可重试</span>':''))+'</div>';
  var body='<div class="stepask">'+st.ask+'</div>';
  var ez=DS.easy?ezBox(st):'';
  var opts='<div class="opts">'+st.opts.map(function(o,i){
      var cls='opt';
      if(answered){ if(i===st.right) cls+=' right'; else if(i===picked) cls+=' wrong'; }
      return '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'+'ABCDE'.charAt(i)+'　'+o+'</button>';
    }).join('')+'</div>';
  var tail='<div class="ans'+(answered?' on':'')+'"></div>';
  d.innerHTML=head+body+ez+opts+tail;
  var btns=[].slice.call(d.querySelectorAll('.opt')), ansEl=d.querySelector('.ans');
  function paint(){
    ansEl.innerHTML='<b>'+(ok?'✓ 对':'✗ 错')+'</b>　正确答案：'+'ABCDE'.charAt(st.right)+'<br>'+st.why;
    if(ok && q.solve && j===q.steps.length-1){
      ansEl.innerHTML += '<div class="solvebox"><b>完整怎么算的</b><br>'+q.solve+'</div>';
    }
    ansEl.classList.add('on');
    if(!ok){
      var btn=document.createElement('button'); btn.className='btn'; btn.textContent='再试一次';
      btn.style.marginTop='10px';
      btn.onclick=function(){ delete DS.res[key]; saveD(); setTab('drill'); };
      ansEl.appendChild(btn);
    }
  }
  if(answered){ paint(); }
  else{
    btns.forEach(function(b){
      b.onclick=function(){
        var i=+b.dataset.i, good=(i===st.right);
        ok = good;
        DS.res[key]= good?1:(i+100); saveD();
        btns.forEach(function(x){ var k=+x.dataset.i; x.disabled=true;
          if(k===st.right) x.classList.add('right'); else if(k===i) x.classList.add('wrong'); });
        d.classList.toggle('done', good);
        paint();
      };
    });
  }
  return d;
}

var view=document.getElementById('view');
var CUR='over';

 CUR=t;
 [].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){ b.classList.toggle('on', b.dataset.t===t); });

 window.scrollTo(0,0);
}
[].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){ b.onclick=function(){ setTab(b.dataset.t); }; });
(function(){
  var be=document.getElementById('btnEasy');
  be.onclick=function(){
    DS.easy=!DS.easy;
    be.setAttribute('aria-pressed',String(!!DS.easy));
    be.textContent = DS.easy ? 'Easy Mode · 开' : 'Easy Mode';
    if(CUR==='drill') setTab('drill');

})();
document.addEventListener('click', function(e){
  var t=e.target;
  while(t && t!==document){
    if(t.getAttribute && t.getAttribute('data-drill')){
      var n=+t.getAttribute('data-drill');
      DRILL3.forEach(function(d,k){ if(d.n===n) DS.cur=k; });
      saveD(); setTab('drill');
      return;
    }
    t=t.parentNode;
  }
}, true);
setTab('over');
