/* ---------- 渲染 ---------- */
function table(list, title){
 var h='<h3 style="margin:10px 0 6px">'+title+'</h3>';
 h+='<table class="tbl"><tr><th style="width:6%">题</th><th style="width:24%">考点</th><th style="width:8%">档</th><th style="width:12%">我推</th><th>动作</th></tr>';
 h+=list.map(function(r){
   return '<tr><td><b>'+r.n+'</b></td><td>'+r.kp+'</td><td><span class="pill t'+r.t+'">'+r.t+'</span></td><td>'+r.ans+'</td><td>'+r.act+'</td></tr>';
 }).join('');
 h+='</table>';
 return h;
}

var mathVer='2';
function paintMath(){
 var box=document.getElementById('mtable');
 if(!box) return;
 var list = mathVer==='2'?A2:A3;
 var cnt={A:0,B:0,C:0};
 list.forEach(function(r){cnt[r.t]++;});
 box.innerHTML = '<div class="note" style="margin:6px 0 8px">本卷：A '+cnt.A+' 题 / B '+cnt.B+' 题 / C '+cnt.C+' 题</div>'+table(list, mathVer==='2'?'模考 2A · 数学 25 题':'模考 3A · 数学 25 题');
 [].slice.call(document.querySelectorAll('#pick button')).forEach(function(b){ b.classList.toggle('on', b.dataset.v===mathVer); });
}

var view=document.getElementById('view');
function setTab(t){
 [].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){ b.classList.toggle('on', b.dataset.t===t); });
 view.innerHTML=TABS[t]();
 if(t==='math'){
   paintMath();
   [].slice.call(document.querySelectorAll('#pick button')).forEach(function(b){
     b.onclick=function(){ mathVer=b.dataset.v; paintMath(); };
   });
 }
 window.scrollTo(0,0);
}
[].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){ b.onclick=function(){ setTab(b.dataset.t); }; });
setTab('over');
</script>
