<style>

@media (max-width:620px){

  .ez-row b{font-size:12px}
}
</style></head><body><div class="wrap">

<h1>写作拆解 · 6 套题逐段拆开</h1>
<p class="sub">论证文按〈引〉〈析〉〈评〉逐段拼，论说文按「观点→例子→回扣」逐段拼，另外五栏补考场规则、翻译要点、小作文 8→9、图表六句法。<b>每一步 4 个选项：1 正确 + 1 强混淆 + 2 送分。</b></p>

<div class="bar" id="tabs">
  <button data-t="arg" class="on">① 论证文</button>
  <button data-t="essay">② 论说文</button>
  <button data-t="rule">③ 考场规则</button>
  <button data-t="trans">④ 英译汉</button>
  <button data-t="letter">⑤ 小作文 8→9</button>
  <button data-t="chart">⑥ 图表六句</button>
</div>

<div class="bar" style="margin-bottom:10px">
  <button class="btn" type="button" id="btnEasy" aria-pressed="false">Easy Mode</button>
  <span class="note" style="align-self:center">开启后：题干关键句高亮 + 显示「关键 / 秒杀 / 陷阱 / 考点」，<b>但不显示答案</b>。</span>
</div>

<main id="view"></main>

<p class="note" style="margin-top:24px">
卷源：三套华章模拟卷（2A/3A 及同批），非统考真题；题目原文见「写作全卷」。这里的 fill 就是可以直接抄进作文的句子。
</p>

</div>
<script>
/* ================= 数据 ================= */
var D={};

/* ---------- ① 论证文：6 步 × 3 套 ---------- */
D.arg={label:'论证文', intro:'标题（一句反驳）→ 靶子（材料想证什么）→ 打点 1 → 打点 2 → 错误类型复盘 → 收束。每个打点都必须写成〈引〉抄半句、〈析〉为什么推不出、〈评〉所以不成立。',
 outline:[
  {seg:'标题',cls:'olqi',quota:'一句反驳',use:'title'},
  {seg:'① 引',cls:'olcheng',quota:'70 字',use:'target'},
  {seg:'② 析1',cls:'olcheng',quota:'150 字',use:'f1'},
  {seg:'③ 析2',cls:'olzhuan',quota:'150 字',use:'f2'},
  {seg:'④ 评',cls:'olhe',quota:'60 字',use:'line'}
 ],
 items:[
 {name:'卷 1 · 银发直播', src:'模拟卷 · 论证有效性分析',
  material:'近几年银发直播快速兴起，不少老年博主凭借短视频、直播收获大量粉丝，由此可见，所有老年人都适合入局直播行业。……有几位老年知识博主凭借讲解文史科普收获大量点赞，这就证明，阅历丰富就一定可以做好直播。……如果老年人参与直播，就可以发挥自身阅历优势；发挥阅历优势，就能够吸引大量粉丝；吸引大量粉丝，就可以实现可观的直播收入。……如果老年人不去做直播，闲暇时间就只能无所事事；如果无所事事，就容易精神空虚；精神空虚，就会加剧老年心理问题。……既可以解决老年人精神孤独，还能显著提高全体老年群体的经济收入。',
  steps:[
  {k:'title',name:'标题',ask:'论证文的标题该写哪一句？',right:1,
   opts:['论银发直播的兴起','银发直播盛行，不等于人人适合','银发直播的利与弊','老年人该不该做直播'],
   why:'B 是一句反驳，且直接否定材料最硬的断言（人人适合）。A、C 是话题，D 是设问——都没有立场。',
   fill:'银发直播盛行，不等于人人适合',
   ez:{h:'标题只写一句反驳，不写「论…」，不写问句。',s:'把材料的结论翻过来，就是一个好标题。',t:'「论…的兴起」「…的利与弊」是话题，不是判断。',p:['标题写法','论点句提取']}},
  {k:'target',name:'靶子句',ask:'开头第一句（复述靶子）该写哪一句？',right:0,
   opts:['材料试图论证「所有老年人都适合入局直播，并能提高全体老年人收入」，然而这条推理在样本、链条与分类三处失守。',
         '材料讨论了银发直播这一新兴现象，观点鲜明。',
         '随着人口老龄化加剧，银发经济越来越受关注。',
         '我认为老年人做直播对身体不好。'],
   why:'A 含「材料试图论证 + 结论 + 后面要打哪三处」，一句话定了全文骨架。B 只是描述；C 是背景；D 是你自己的观点。',
   fill:'材料试图论证「所有老年人都适合入局直播，并能提高全体老年人收入」，然而这条推理在样本、链条与分类三处失守。',
   ez:{h:'靶子句＝「材料试图论证 X」＋ X 必须是材料的结论句。',s:'先找「由此可见/因此/说明」后面那句，那就是靶子。',t:'把背景句、数据句当靶子，后面就打空了。',p:['结论识别']}},
  {k:'f1',name:'打点 1（样本与概念）',ask:'第一条该怎么落笔？',right:1,
   opts:['材料说「不少」，但没给具体人数，数据不够详实。',
         '〈引〉材料由「不少老年博主收获大量粉丝」推出「所有老年人都适合入局」。〈析〉这是以偏概全：被看见的成功者恰是被算法筛选过的样本，且「收获粉丝」不等于「适合入局」。〈评〉因此该推论不能成立。',
         '老年人体力不好，无法长时间直播。',
         '建议平台出台规范，保护老年主播权益。'],
   why:'B 三件套齐全：引原句、命名谬误、说出为什么推不出。A 抓了细节但没命名谬误；C 引入材料外事实；D 是建议。',
   fill:'〈引〉材料由「不少老年博主收获大量粉丝」推出「所有老年人都适合入局」。〈析〉这是以偏概全：被看见的成功者恰是被算法筛选过的样本，且「收获粉丝」不等于「适合入局」。〈评〉因此该推论不能成立。',
   ez:{h:'〈引〉抄原句（可截半句）→〈析〉命名谬误 + 说为什么 →〈评〉因此不成立。',s:'三个动作缺一个就掉档：没引原句＝空谈，没命名＝外行，没说明＝喊口号。',t:'「数据不详」「不符合事实」都不算谬误名。',p:['以偏概全','概念偷换','引析评']}},
  {k:'f2',name:'打点 2（链条与条件）',ask:'第二条该怎么落笔？',right:2,
   opts:['老年人不会用智能手机，直播对他们不现实。',
         '直播平台应当优化面向老年人的界面。',
         '〈引〉材料由「不需要复杂场地」一路推到「发挥优势—涨粉—可观收入」。〈析〉这是条件误用：不需要场地只消除了入行门槛，优势不等于有人看，有人看不等于有收入，而收入高度集中在头部。〈评〉因此这条链每一环都缺条件。',
         '材料把直播收入说得太容易了。'],
   why:'C 用「条件误用」+ 逐环说明，且点名了收入分布这一硬事实。A、B 在材料外；D 只表态没分析。',
   fill:'〈引〉材料由「不需要复杂场地」一路推到「发挥优势—涨粉—可观收入」。〈析〉这是条件误用：不需要场地只消除了入行门槛，优势不等于有人看，有人看不等于有收入，而收入高度集中在头部。〈评〉因此这条链每一环都缺条件。',
   ez:{h:'链条题：把 A→B→C→D 写出来，逐环问「这一步凭什么」。',s:'链条越长越好打，最短的那一环就是你的打点。',t:'只说「太绝对」而不说断在哪一环，是半对。',p:['条件误用','连锁推理','必要/充分条件']}},
  {k:'type',name:'错误类型复盘',ask:'材料里「不直播就只能无所事事 → 空虚 → 心理问题」属于哪一类？',right:0,
   opts:['虚假二分 + 滑坡','强加因果','以偏概全','单因归谬'],
   why:'A 对：先把两种选择人为缩成两种（虚假二分），再一级一级往下推（滑坡）。B 是两事并存硬说因果；C 是部分推全体；D 是多元结果归给单一原因。',
   fill:'该段属于虚假二分 + 滑坡：老年人的闲暇还有书画、旅行、社区服务，不是「只有直播」与「无所事事」二选一；后接三级推断，也缺少支持。',
   ez:{h:'六类要能一眼分：以偏概全（部分→全体）｜强加因果（相关≠因果）｜因果倒置（果当因）｜单因归谬（多因→一因）｜滑坡（一级推到灾难）｜条件误用（充分当必要）。',s:'先问「它把什么当成了什么」，再对号。',t:'虚假二分常和滑坡连用，两个名字都要写。',p:['六类谬误','虚假二分']}},
  {k:'line',name:'收束句',ask:'结尾该写哪一句？',right:1,
   opts:['因此，我们要坚决反对老年人做直播。','综上，材料把「部分可行」写成了「人人适合」，把「门槛降低」当成了「收益必然」，结论的普遍性缺乏支撑。','综上所述，银发直播有利有弊。','希望有关部门加强监管。'],
   why:'B 回到靶子，用两个「把…写成…」收住两处打点。A 是表态；C 是套话；D 是建议。',
   fill:'综上，材料把「部分可行」写成了「人人适合」，把「门槛降低」当成了「收益必然」，结论的普遍性缺乏支撑。',
   ez:{h:'收束只做一件事：回到靶子说「推不出」。',s:'用「把 A 写成 B」的句式，两处打点一次收住。',t:'「有利有弊」「辩证看待」＝没结论，直接三类卷。',p:['收束写法']}}
  ]},

 {name:'卷 2 · 一人创业 + AI', src:'模拟卷 · 论证有效性分析',
  material:'一人创业模式越来越多地出现在大众视野。由此可见，未来个体创业将彻底取代传统团队创业。……部分一人创业者取得了不错的收益。这意味着，只要用好 AI 工具，普通个人就一定能创业成功。……省去人力成本，就可以大幅压低经营成本；经营成本足够低，就可以在市场上获得价格优势；拥有价格优势，就必然抢占大量市场份额。……没有复杂的内部协调，就不会出现团队矛盾；不出现团队矛盾，企业就可以稳定持续盈利。',
  steps:[
  {k:'title',name:'标题',ask:'标题该写哪一句？',right:0,
   opts:['一人加 AI，不等于创业成功','论 AI 时代的一人创业','一人创业的机遇与挑战','AI 会取代团队吗'],
   why:'A 同时否定了材料两个「必然」的核心。B、C 是话题；D 换成了「AI 与团队」这个更大的题。',
   fill:'一人加 AI，不等于创业成功',
   ez:{h:'标题＝把材料最硬的断言翻过来。',s:'材料有两个「必然」时，标题可以一并否掉。',t:'「机遇与挑战」是万能话题，没有立场。',p:['标题写法']}},
  {k:'target',name:'靶子句',ask:'开头第一句该写哪一句？',right:1,
   opts:['AI 工具正在改变创业方式。','材料试图论证「个体创业将彻底取代团队创业」，以及「只要用好 AI，普通个人就一定能成功」，这两步都跳过了关键条件。','一人创业的成本比团队创业低。','我认为一人创业风险很大。'],
   why:'B 一次抓住两个结论，并预告「跳过条件」。A 是背景；C 是材料的分论点；D 是你的观点。',
   fill:'材料试图论证「个体创业将彻底取代团队创业」，以及「只要用好 AI，普通个人就一定能成功」，这两步都跳过了关键条件。',
   ez:{h:'一段材料有两个结论，就写两个靶子，后面一段打一个。',s:'用「以及」把两个结论串起来。',t:'只打一个，另一段就没地方落脚。',p:['多结论材料']}},
  {k:'f1',name:'打点 1（趋势外推）',ask:'第一条该怎么落笔？',right:2,
   opts:['「彻底」这个词太绝对了。','团队创业更容易成功。','〈引〉材料由「一人创业越来越多」推出「将彻底取代团队创业」。〈析〉这是把趋势当结局：复杂制造、医疗、金融有资质与责任约束，AI 降低的是执行成本，不是合规成本。〈评〉因此「取代」的结论下得过早。','政府应当鼓励一人创业。'],
   why:'C 给的是「哪个领域、降的是哪种成本」这类具体理由。A 只抓绝对词；B、D 都在材料外。',
   fill:'〈引〉材料由「一人创业越来越多」推出「将彻底取代团队创业」。〈析〉这是把趋势当结局：复杂制造、医疗、金融有资质与责任约束，AI 降低的是执行成本，不是合规成本。〈评〉因此「取代」的结论下得过早。',
   ez:{h:'趋势题的打法是「举反例领域」——哪个行业它进不去。',s:'「降低执行成本 ≠ 降低合规成本」是最好用的一句。',t:'只说「太绝对」，评卷看不到分析。',p:['趋势外推','绝对化']}},
  {k:'f2',name:'打点 2（幸存者偏差）',ask:'第二条该怎么落笔？',right:1,
   opts:['一人创业的成功率很低。','〈引〉材料由「部分一人创业者取得不错收益」推出「普通个人用好 AI 就一定能成功」。〈析〉这是幸存者偏差：失败者不可见；且创业还需需求验证、渠道、信任与现金流，AI 只压缩了执行这一段。〈评〉因此「一定能成功」缺乏依据。','创业风险大，不建议普通人尝试。','应当先统计创业成功率。'],
   why:'B 命名了偏差，并指出「工具只解决其中一段」。A 给结论无据；C 是劝告；D 是把活推给别人。',
   fill:'〈引〉材料由「部分一人创业者取得不错收益」推出「普通个人用好 AI 就一定能成功」。〈析〉这是幸存者偏差：失败者不可见；且创业还需需求验证、渠道、信任与现金流，AI 只压缩了执行这一段。〈评〉因此「一定能成功」缺乏依据。',
   ez:{h:'看到「有人做成了」，先问「没做成的人在哪」。',s:'把成功拆成四段：需求、渠道、信任、现金流——AI 只占一段。',t:'说「成功率低」但没挂在材料的推理上，是另起话题。',p:['幸存者偏差','以偏概全']}},
  {k:'type',name:'错误类型复盘',ask:'「省工资→成本低→价格优势→必然抢占份额」属于哪一类？',right:1,
   opts:['因果倒置','连锁推理（每环可断）','单因归谬','强加因果'],
   why:'B 对：四步连推，每环都只是可能。因果倒置是把果当因；单因归谬是把多因结果归给单一原因；强加因果是两事并无因果却硬连——这三类都不套「四步链」。',
   fill:'该段属于连锁推理：四步连推、每环都可断——算力与获客会补上成本，份额也未必带来利润，故不能推出「必然抢占份额」。',
   ez:{h:'四步以上、每步都用「就可以/就必然」连接的，是连锁推理。',s:'数一数有几个箭头，箭头越多越好打。',t:'把它叫「强加因果」会被扣分——强加因果只有一环。',p:['连锁推理','六类谬误']}},
  {k:'line',name:'收束句',ask:'结尾该写哪一句？',right:0,
   opts:['综上，材料把「门槛下降」等同于「成功必然」，把「组织形态」混同于「产业格局」，结论超出了论据能支撑的范围。','总之，AI 创业有利有弊。','所以建议大家谨慎创业。','未来已来，应当拥抱变化。'],
   why:'A 收在两个概念混用上，与前文不重复。B、C、D 分别是套话、劝告、口号。',
   fill:'综上，材料把「门槛下降」等同于「成功必然」，把「组织形态」混同于「产业格局」，结论超出了论据能支撑的范围。',
   ez:{h:'收束要能一句话概括全文两处打点。',s:'「把 A 等同于 B」是最好用的收束骨架。',t:'「拥抱变化」「未来已来」是零分句。',p:['收束写法']}}
  ]},

 {name:'卷 3 · 短视频替代读书', src:'模拟卷 · 论证有效性分析',
  material:'很多人习惯刷短视频获取各类知识。由此可见，碎片化短视频阅读可以完全替代深度书本阅读。……短视频把大部头书籍拆解为几分钟的片段……这说明，人们通过短视频就可以掌握书本全部核心内容。……如果更多人愿意学习，国民整体知识素养就会快速提升。……一些短视频创作者本身就是高校学者，产出的内容质量很高。既然有高质量短视频，那么碎片化学习就不会带来认知缺陷。……我们应当大力鼓励大众放弃传统读书。',
  steps:[
  {k:'title',name:'标题',ask:'标题该写哪一句？',right:1,
   opts:['论短视频时代的学习','短视频能替代书本吗','碎片化学习的利与弊','读书与刷视频'],
   why:'B 是一句设问式反驳，且直指「替代」这个断言。A、C、D 都是把两个对象摆在一起，没有判断。',
   fill:'短视频替代不了深度阅读',
   ez:{h:'设问也可以，但必须指向材料的断言。',s:'「X 替代不了 Y」比「X 与 Y」有力。',t:'「…的利与弊」是三类卷标题。',p:['标题写法']}},
  {k:'target',name:'靶子句',ask:'开头第一句该写哪一句？',right:0,
   opts:['材料由「很多人刷短视频学知识」推到「可以完全替代深度阅读」，中间隔着理解、系统性与价值判断三道槛。','材料讨论了短视频对学习方式的影响。','短视频已成为主要的信息获取渠道。','我认为读书更有价值。'],
   why:'A 复述结论 + 预告三道槛。B 描述；C 背景；D 是你的立场。',
   fill:'材料由「很多人刷短视频学知识」推到「可以完全替代深度阅读」，中间隔着理解、系统性与价值判断三道槛。',
   ez:{h:'靶子句要写「由 X 推到 Y」，X 与 Y 都取自原文。',s:'结尾预告你要打几处，全文就有了骨架。',t:'只写「材料讨论了…」不是靶子。',p:['结论识别']}},
  {k:'f1',name:'打点 1（拆解≠理解）',ask:'第一条该怎么落笔？',right:2,
   opts:['短视频内容太浅，学不到东西。','很多短视频是娱乐内容。','〈引〉材料由「拆成几分钟片段」推出「掌握书本全部核心内容」。〈析〉这是把拆解当成理解：书本的核心往往是一套论证——前提、推理、边界与反例，片段给出的多是结论，删掉的正是论证。〈评〉因此「全部核心内容」无从谈起。','应当限制刷短视频的时间。'],
   why:'C 说清了「被删掉的是什么」，这是本题的核心。A 是结论式判断；B、D 离开推理。',
   fill:'〈引〉材料由「拆成几分钟片段」推出「掌握书本全部核心内容」。〈析〉这是把拆解当成理解：书本的核心往往是一套论证——前提、推理、边界与反例，片段给出的多是结论，删掉的正是论证。〈评〉因此「全部核心内容」无从谈起。',
   ez:{h:'「拆解」类题的关键词是「删掉了什么」。',s:'一句「删掉的正是论证」就能立住。',t:'说「内容浅」是价值判断，不是推理分析。',p:['概念偷换','拆解≠理解']}},
  {k:'f2',name:'打点 2（强加因果/答非所问）',ask:'第二条该怎么落笔？',right:0,
   opts:['〈引〉材料用「一些创作者是高校学者、内容质量高」来反驳「碎片化带来认知缺陷」。〈析〉这是个例推普遍，且用供给端质量回答需求端风险——算法偏好还会强化既有偏见。〈评〉因此该反驳无效。','高校学者做短视频是好事。','短视频创作者水平参差不齐。','应当鼓励更多专家拍短视频。'],
   why:'A 同时点了「个例推普遍」与「两侧错位」两个动作。B 同向赞同；C 是事实描述；D 是建议。',
   fill:'〈引〉材料用「一些创作者是高校学者、内容质量高」来反驳「碎片化带来认知缺陷」。〈析〉这是个例推普遍，且用供给端质量回答需求端风险——算法偏好还会强化既有偏见。〈评〉因此该反驳无效。',
   ez:{h:'「有人做得好」不能证明「所以你学了没事」——供给≠需求。',s:'补一句「算法强化偏见」，反打得更狠。',t:'只写「水平参差不齐」是描述，不是分析。',p:['个例推普遍','答非所问']}},
  {k:'type',name:'错误类型复盘',ask:'「门槛低→愿意学→素养快速提升」属于哪一类？',right:2,
   opts:['以偏概全','强加因果','把意愿、行为、能力混为一谈（滑坡）','因果倒置'],
   why:'C 对：三级链条，且每一级换了一个概念（愿意≠做到≠会）。以偏概全是部分推全体；强加因果只有两环；因果倒置是顺序反了。',
   fill:'该段属于滑坡并混用了三个概念：愿意学是起点，坚持学需要反馈，素养提升需要长期训练，三者之间没有自动传导。',
   ez:{h:'每升一级就换一个词的链，既是滑坡也是概念混用。',s:'指出「愿意≠做到≠会」三个词，比只说滑坡更深。',t:'只说「太理想化」不算命名。',p:['滑坡','概念混用']}},
  {k:'line',name:'收束句',ask:'结尾该写哪一句？',right:1,
   opts:['总之，短视频学习有利有弊。','因此，材料把「使用频率」当成「学习质量」，把「内容供给」当成「学习效果」，最后又把事实判断直接换成了价值主张。','我们要拒绝碎片化学习。','相信技术会解决这些问题。'],
   why:'B 三处收成一句，且落在「事实→价值」这个最硬的错上。A 套话；C 表态；D 是期待。',
   fill:'因此，材料把「使用频率」当成「学习质量」，把「内容供给」当成「学习效果」，最后又把事实判断直接换成了价值主张。',
   ez:{h:'最后一处错如果是「应当」，一定要点「事实推不出价值」。',s:'「由事实直接跳到价值」是加分句。',t:'「拒绝碎片化」是你自己的主张。',p:['事实与价值','收束写法']}}
  ]}
 ]};

D.essay={label:'论说文', intro:'标题（两边都要在）→ 起（给判断）→ 正段观点 → 正段例子+回扣 → 反段观点 → 反段例子+回扣 → 合（升华）。正反必须互相制约，合段给边界而不是口号。',
 outline:[

  {seg:'② 正·例',cls:'olcheng',quota:'170 字',use:'posex'},
  {seg:'③ 反·观点',cls:'olzhuan',quota:'80 字',use:'neg'},

 items:[
 {name:'卷 1 · 产业迭代：顺势 vs 深耕', src:'模拟卷 · 论说文（与 2026 长期/短期同题）',
  material:'产业迭代浪潮之下，新赛道热点迭起。不少企业面临抉择：是顺势奔逐新兴风口，抢抓时代赋予的短期红利；还是沉潜深耕固有主业，淬炼难以被复制的核心禀赋。',
  steps:[
  {k:'title',name:'标题',ask:'标题该起成哪一句？',right:1,
   opts:['论长期主义的重要性','定方向要慢，迈步子要快','企业如何应对产业迭代','顺势与深耕'],
   why:'B 两边都在，且给了关系（方向慢 / 步子快）。A 只写一边；C 换成「怎么办」；D 只是两个词并列。',
   fill:'定方向要慢，迈步子要快',
   ez:{h:'标题必须同时出现两边，并给出关系。',s:'「A 要慢，B 要快」这种对仗最好用。',t:'只写「论 X 的重要性」＝只写一边，直接二类。',p:['双边标题']}},
  {k:'open',name:'起段判断',ask:'第 1 段该写哪一句？',right:0,
   opts:['二者并非二选一，而是供养关系：短期提供现金流，长期提供方向与壁垒。','这两种观点都有道理，应当辩证看待。','长期主义更重要，因为根基决定一切。','企业应当同时重视长期与短期。'],
   why:'A 给了判断，并给出「供养」这个关系词，后文两段正好各写一头。B 是空判断；C 选边；D 是折中无内容。',
   fill:'二者并非二选一，而是供养关系：短期提供现金流，长期提供方向与壁垒。',
   ez:{h:'起段只做两件事：复述张力 + 立刻给判断。',s:'判断句里要有一个「关系词」：供养 / 前提 / 底线 / 边界。',t:'「都有道理」「辩证看待」＝没判断。',p:['起段写法','关系句']}},
  {k:'pos',name:'正段观点',ask:'第 2 段的分论点该写哪一句？',right:0,
   opts:['没有短期兑现，长期沉淀就撑不到兑现那一天：定力要靠现金流供养。','短期突围能带来现金流，所以很重要。','华为的长期投入证明了长期主义有效。','现金流是企业的血液。'],
   why:'A 写出「缺了 A，B 就失效」，这是二类与三类的分水岭。B 只是「很重要」；C 是例子；D 是比喻。',
   fill:'没有短期兑现，长期沉淀就撑不到兑现那一天：定力要靠现金流供养。',
   ez:{h:'正段句式：「没有 A，B 就失效」。',s:'套进去就是一句合格分论点。',t:'「A 很重要」是二类卷的典型句。',p:['分论点句式','缺A则B失效']}},
  {k:'posex',name:'正段例子 + 回扣',ask:'正段该用哪个例子、怎么回扣？',right:1,
   opts:['比亚迪 2022 年销量全球第一，说明短期突围很有效。','比亚迪用燃油车现金流养三电到 2022 年，直到那年才停产燃油车——回扣：短期的钱，供养了长期的投入。','举马云创业的例子，说明坚持就能成功。','引用「不积跬步无以至千里」。'],
   why:'B 的「动作」与正段论点同构（现金流供养长期）。A 是结果，回扣不上「供养」；C 是万能例子；D 是名言不是例子。',
   fill:'比亚迪用燃油车现金流养三电到 2022 年，直到那年才停产燃油车——回扣：短期的钱，供养了长期的投入。',
   ez:{h:'例子三句话：谁·什么时候·做了什么 → 结果 → 回扣。',s:'回扣句里必须出现分论点的原词（供养）。',t:'写「市值第一」「销量第一」是结果，回扣不上动作。',p:['例子回扣','同构读法']}},
  {k:'neg',name:'反段观点',ask:'第 3 段的分论点该写哪一句？',right:1,
   opts:['长期主义同样重要，企业要有耐心。','没有核心禀赋，风口上的位置就守不住：红利会被同样入场的人迅速摊薄。','柯达因为固守胶卷而失败。','风口往往伴随着泡沫。'],
   why:'B 与正段互相制约：正段说没有短期活不到，反段说没有长期守不住。A 是「也重要」；C 是例子；D 是泛论。',
   fill:'没有核心禀赋，风口上的位置就守不住：红利会被同样入场的人迅速摊薄。',
   ez:{h:'反段必须和正段「咬合」：一个说缺 A 不行，一个说缺 B 不行。',s:'两段各写一头，就叫「正着说、反着说」。',t:'「也很重要」＝各夸一遍，不是互相制约。',p:['正反咬合']}},
  {k:'negex',name:'反段例子 + 回扣',ask:'反段该用哪个例子、怎么回扣？',right:0,
   opts:['英伟达 2006 年起做 CUDA，十余年不被看好，2012 年后才集中兑现——回扣：沉淀决定你能不能守住位置。','英伟达市值全球第一，说明长期投入有回报。','诺基亚因为不创新而倒闭。','亚马逊不断扩张，说明要敢于尝试。'],
   why:'A 是动作 + 时间跨度 + 回扣。B 是结果；C 是单因归因；D 与本题反向。',
   fill:'英伟达 2006 年起做 CUDA，十余年不被看好，2012 年后才集中兑现——回扣：沉淀决定你能不能守住位置。',
   ez:{h:'反段例子要和正段例子「反向对称」：一个证明短期必要，一个证明长期必要。',s:'时间跨度（十余年）比数字更有说服力。',t:'「市值第一」不能证明「沉淀」，只能证明结果。',p:['例子回扣','反向对称']}},
  {k:'edge',name:'合段（升华/边界）',ask:'第 4 段该写哪一句？',right:0,
   opts:['定方向要慢，迈步子要快：买时间的钱可以快进快出，买位置的钱必须按年计。','因此企业要兼顾长期与短期，才能行稳致远。','所以我们要大力提倡长期主义。','时代在变，企业也要变。'],
   why:'A 给出可执行的判准（哪笔钱怎么花），这就是「升华」——把两者的关系落成一个标准。B 是口号；C 选边；D 空话。',
   fill:'定方向要慢，迈步子要快：买时间的钱可以快进快出，买位置的钱必须按年计。',
   ez:{h:'合段要给「边界」或「标准」，不给「要兼顾」。',s:'能落成「哪笔钱怎么花」这种判准，就是升华。',t:'「行稳致远」「兼顾两者」是三类卷结尾。',p:['合段写法','升华']}}
  ]},

 {name:'卷 2 · 园艺：繁茂与收敛', src:'模拟卷 · 论说文',
  material:'园艺实践之中，部分果树枝叶繁茂，蔚然可观，却结实寥寥；另有一类果树，主动抑止徒长冗枝，收敛外在的繁盛之态，将养分向内沉淀，终得累累硕果。',

/* ================= 引擎 ================= */
var KEY='kaoyan.wbreak.v1';
var S={tab:'arg', cur:{}, res:{}, easy:false};
try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); S.cur=o.cur||{}; S.res=o.res||{}; S.easy=!!o.easy; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({cur:S.cur,res:S.res,easy:S.easy})); }catch(e){} }
function keyOf(item,st){ return item.name+'|'+st.k; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var view=document.getElementById('view');

function ezBox(st){
  if(!st.ez) return '';
  var e=st.ez;
  return '<div class="ezbox">'+
   (e.h?'<div class="ez-row ez-key"><b>关键</b><div>'+esc(e.h)+'</div></div>':'')+
   (e.s?'<div class="ez-row ez-kill"><b>秒杀</b><div>'+esc(e.s)+'</div></div>':'')+
   (e.t?'<div class="ez-row ez-trap"><b>陷阱</b><div>'+esc(e.t)+'</div></div>':'')+
   (e.p&&e.p.length?'<div class="ez-row ez-kp"><b>考点</b><div>'+e.p.map(function(x){return '<span class="kptag">'+esc(x)+'</span>';}).join('')+'</div></div>':'')+
   '</div>';
}

function renderTrack(t){
  var tr=D[t], idx=S.cur[t]||0, item=tr.items[idx];
  var html='<div class="card"><span class="qtag">'+tr.label+'</span>'+
   '<p class="note" style="margin:8px 0 0">'+esc(tr.intro)+'</p>'+
   '<div class="bar mini" style="margin:10px 0 0" id="items">'+tr.items.map(function(it,i){
     var done=it.steps.filter(function(st){return S.res[keyOf(it,st)]===1;}).length;
     return '<button data-i="'+i+'" class="'+(i===idx?'on':'')+'">'+esc(it.name)+'<br><span class="note">'+done+'/'+it.steps.length+'</span></button>';
   }).join('')+'</div></div>';
  html+='<div class="card"><div class="idxline">'+esc(item.src)+'</div>'+
   '<h2 style="margin:2px 0 8px">'+esc(item.name)+'</h2>'+
   '<div class="material">'+esc(item.material)+'</div></div>';
  html+='<div id="steps"></div><div class="card" id="ol"></div>';
  view.innerHTML=html;
  [].slice.call(document.querySelectorAll('#items button')).forEach(function(b){
    b.onclick=function(){ S.cur[t]=+b.dataset.i; save(); renderTrack(t); };
  });
  var box=document.getElementById('steps');
  item.steps.forEach(function(st,si){ box.appendChild(stepEl(item,st,si)); });
  drawOutline(item);
}

function stepEl(item,st,si){
  var k=keyOf(item,st), rec=S.res[k];
  var answered=(rec!=null);
  var picked = answered ? (rec>1 ? rec-100 : st.right) : null;
  var ok = answered && rec===1;
  var d=document.createElement('div');
  d.className='step'+(ok?' done':'');
  var head='<div class="stephd"><span class="stepno">'+(si+1)+'</span><span>'+esc(st.name)+'</span>'+
    (ok?'<span style="color:var(--ok);font-weight:700">✓ 已答对</span>':(answered?'<span style="color:var(--warn);font-weight:700">✗ 答错过，可重试</span>':''))+'</div>';
  var body='<div class="stepask">'+esc(st.ask)+'</div>';
  var ez = S.easy ? ezBox(st) : '';
  var opts='<div class="opts">'+st.opts.map(function(o,i){
      var cls='opt';
      if(answered){ if(i===st.right) cls+=' right'; else if(i===picked) cls+=' wrong'; }
      return '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'+
        'ABCD'.charAt(i)+'　'+esc(o)+'</button>';
    }).join('')+'</div>';
  var tail='<div class="ans'+(answered?' on':'')+'"></div>';
  d.innerHTML=head+body+ez+opts+tail;
  var btns=[].slice.call(d.querySelectorAll('.opt'));
  var ansEl=d.querySelector('.ans');
  function paint(){
    ansEl.innerHTML='<b>'+(ok?'✓ 对':'✗ 错')+'</b>　正确答案：'+'ABCD'.charAt(st.right)+
      '<br>'+esc(st.why)+
      (ok?'<br><br><b>已填入骨架：</b>'+esc(st.fill):'');
    ansEl.classList.add('on');
    if(!ok){
      var btn=document.createElement('button'); btn.className='btn'; btn.textContent='再试一次';
      btn.style.marginTop='10px';
      btn.onclick=function(){ delete S.res[k]; save(); renderTrack(S.tab); };
      ansEl.appendChild(btn);
    }
  }
  if(answered){ paint(); }
  else{
    btns.forEach(function(b){
      b.onclick=function(){
        picked=+b.dataset.i; ok=(picked===st.right);
        S.res[k]= ok?1:(picked+100);
        save();
        btns.forEach(function(x){
          var i=+x.dataset.i; x.disabled=true;
          if(i===st.right) x.classList.add('right'); else if(i===picked) x.classList.add('wrong');
        });
        d.classList.toggle('done', ok);
        paint(); drawOutline(item);
      };
    });
  }
  return d;
}

function drawOutline(item){
  var tr=D[S.tab]||D.arg;
  var rows=item.outline||tr.outline;
  var html='<span class="qtag">实时骨架</span><div class="note" style="margin:7px 0 10px">每答对一步，对应位置就被填上。全部走完，这就是可以直接抄进作文的骨架。</div>';
  rows.forEach(function(r){
    var st=item.steps.filter(function(x){return x.k===r.use;})[0];
    var rec=st?S.res[keyOf(item,st)]:null;
    var txt=(st&&rec===1)?'<span class="fill">'+esc(st.fill)+'</span>':'<span class="ph">待定</span>';
    html+='<div class="olrow"><div><span class="olseg '+r.cls+'">'+esc(r.seg)+'</span></div>'+
      '<div class="olbody">'+txt+'<span class="quota">'+esc(r.quota)+'</span></div></div>';
  });
  var all=item.steps.every(function(st){return S.res[keyOf(item,st)]===1;});
  html+='<div class="actions">'+
    (all?'':'<button class="btn primary" id="btnAll">一键填入完整骨架</button>')+
    '<button class="btn'+(all?' primary':'')+'" id="btnCopy">复制这份骨架</button>'+
    (all?'<button class="btn" id="btnClear">清空本组，重做</button>':'')+'</div>';
  var ol=document.getElementById('ol'); ol.innerHTML=html;
  if(!all){
    document.getElementById('btnAll').onclick=function(){
      item.steps.forEach(function(st){ if(S.res[keyOf(item,st)]!==1) S.res[keyOf(item,st)]=1; });
      save(); renderTrack(S.tab);
    };
  }else{
    document.getElementById('btnClear').onclick=function(){
      item.steps.forEach(function(st){ delete S.res[keyOf(item,st)]; });
      save(); renderTrack(S.tab);
    };
  }
  document.getElementById('btnCopy').onclick=function(){
    var txt=item.name+'\n';
    rows.forEach(function(r){
      var st=item.steps.filter(function(x){return x.k===r.use;})[0];
      txt+=r.seg+'（'+r.quota+'）：'+((st&&S.res[keyOf(item,st)]===1)?st.fill:'（待定）')+'\n';
    });
    copyText(txt); this.textContent='已复制 ✓';
  };
}

function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).catch(function(){fb(txt);}); }
  else fb(txt);
  function fb(s){
    var ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }
}

function setTab(t){
  S.tab=t;
  [].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){ b.classList.toggle('on', b.dataset.t===t); });
  renderTrack(t);
  window.scrollTo(0,0);
}
[].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){ b.onclick=function(){ setTab(b.dataset.t); }; });

var btnEasy=document.getElementById('btnEasy');
function paintEasy(){
  btnEasy.setAttribute('aria-pressed',String(!!S.easy));
  btnEasy.textContent = S.easy ? 'Easy Mode · 开' : 'Easy Mode';
  btnEasy.classList.toggle('primary', !!S.easy);
}
btnEasy.onclick=function(){ S.easy=!S.easy; save(); paintEasy(); renderTrack(S.tab); };
paintEasy();
setTab('arg');
</script>
</body></html>
