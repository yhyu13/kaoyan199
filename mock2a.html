  '<h2 style="margin-top:10px">(b) 不常考，但动脑能解 —— 值得知道</h2>'+
  '<table class="tbl"><tr><th style="width:26%">类型</th><th style="width:14%">本卷</th><th>为什么值得会</th></tr>'+
  '<tr><td><b>质因数分解</b></td><td>19 题</td><td>1350=2·3³·5²，「三个数都是质数」把分解锁死。整道题只有一个动作：分解。</td></tr>'+
  '<tr><td><b>集合 / 百分比</b></td><td>17 题</td><td>设总数 100，两条件各算一次比例。计算量极小，是条件充分性里最好拿的分。</td></tr>'+
  '<tr><td><b>多项式因式定理</b></td><td>25 题</td><td>「x−1 是因式」＝ f(1)=0，一句话出方程。考场上 40 秒能做完。</td></tr>'+
  '<tr><td><b>三角形面积×高</b></td><td>24 题</td><td>S=½·AB·h，两个未知一个方程 → 必须联合。认得这个结构就不会误选 A。</td></tr>'+
  '<tr><td><b>球与圆柱相切</b></td><td>12 题</td><td>切点条件写成三个距离，勾股一次出。属于「见过就会、没见过就懵」的题。</td></tr></table>'+
  '<div class="note">这五类的共同点：<b>方法唯一、计算量小、不需要灵感</b>。它们的性价比远高于任何一道立体几何综合题。</div></div>'+

  '<div class="card"><h3 style="margin-top:0">(c) 基本不让人过 —— 别复习</h3>'+
  '<table class="tbl"><tr><th style="width:30%">长相</th><th style="width:14%">本卷</th><th>为什么放弃</th></tr>'+
  '<tr><td><b>两个绝对值套在一起</b></td><td>10 题</td><td>分支按平方涨，5 分钟做不完。本题的解法是「对称性求和」，属于技巧不是通法——<b>会技巧的人本来就会，不会的人学了也用不上</b>。</td></tr>'+
  '<tr><td><b>两根互换就变值的韦达题</b></td><td>16 题</td><td>x₁²−2x₂² 不对称，条件永远定不出唯一值。识别特征：<b>式子对 x₁、x₂ 不对称</b> → 直接 E。</td></tr>'+
  '<tr><td><b>要分类讨论的恒等变形</b></td><td>22 题</td><td>条件 1 要凑 a(b+c−a)=bc，推导链路长。条件 2 是配方，会就 20 秒、不会就 5 分钟——<b>只学配方那一半</b>。</td></tr>'+
  '<tr><td><b>依赖图形的面积分割</b></td><td>9 题</td><td>读图成本高于计算成本，而且图一换就废。</td></tr>'+
  '<tr><td><b>题干不完整的题</b></td><td>18 题</td><td>信息缺失，再聪明也做不出来。考场上一分钟没头绪就跳。</td></tr></table>'+
  '<div class="warnbox"><b>「放弃」的正确姿势：</b>不是不学，是把它们压到<b>30 秒识别 + 立刻跳</b>。你要练的是「一眼认出这是哪一类」，而不是「解出来」。</div></div>'+

  '<div class="card"><h3 style="margin-top:0">(d) 20 之外的提分点（按 ROI 排）</h3>'+
  '<table class="tbl"><tr><th style="width:32%">提分点</th><th style="width:14%">本卷能拿</th><th>怎么练</th></tr>'+
  '<tr><td><b>① 条件充分性的判定顺序</b></td><td>最多 30 分</td><td>先单独试 1、再单独试 2、最后才联立。<b>一上来联立＝自动丢掉 A/B/D 三个选项</b>。本卷 20、23、25 是 A 档，全靠这个顺序。</td></tr>'+
  '<tr><td><b>② 三个万能动作</b></td><td>约 4–6 题</td><td>特殊值（0/1/−1/边界）、极端化（推到相等或无穷）、图形化（画出来看区间）。能在 40 秒内判掉绝大多数条件充分性。</td></tr>'+
  '<tr><td><b>③ 选项反代</b></td><td>2–3 题</td><td>求值类题目直接把选项代回题干，比正向算快一倍，第 3、15 题都适用。</td></tr>'+
  '<tr><td><b>④ 单位与量纲检查</b></td><td>1 题</td><td>第 13 题 km/h→m/s，这一步错了整题全废。凡是「速度+时间」的题，第一步先换单位。</td></tr>'+
  '<tr><td><b>⑤ 分组 vs 分配的判别</b></td><td>2 题</td><td>「分给三个点」是分配（点不同）；「分成三组」是分组（要除组数阶乘）。第 11 题错在这一点上的人最多。</td></tr></table>'+
  '<div class="okbox"><b>这五条合起来大约值 12–15 分</b>，正好补上你 78 到 90 的缺口。而且它们不需要新知识，只需要固定动作。</div></div>';
};

TABS.lg=function(){
 var h='<div class="card"><span class="qtag">分析推理</span>'+
  '<h2 style="margin-top:10px">本卷分析推理 17 题，其实是同一个动作</h2>'+
  '<div class="big">'+
   '<div class="b"><div class="v">17</div><div class="k">题量（39–55）</div></div>'+
   '<div class="b"><div class="v">34</div><div class="k">分值</div></div>'+
   '<div class="b"><div class="v">3</div><div class="k">真正要练的题型</div></div>'+
  '</div>'+
  '<p style="margin:8px 0 0">排位、匹配、组合——<b>三种题共用一套动作：画表 → 落硬约束 → 反代验选项</b>。所以「17 题」听起来多，实际只有 3 套模板。</p></div>';

 h+='<div class="card"><h3 style="margin-top:0">(a) 提分点：这四条能直接换分</h3>'+
  '<table class="tbl"><tr><th style="width:30%">动作</th><th>为什么值钱</th><th style="width:22%">本卷适用</th></tr>'+
  '<tr><td><b>① 硬约束优先</b></td><td>题干里「一定 / 不能 / 相邻」的条件先落到表上，它会把可能性一次性砍掉一半</td><td>41、42、43、46、51</td></tr>'+
  '<tr><td><b>② 表格化</b></td><td>五人五物的题一律画二维表，不要在脑子里推；表一画出来，答案常常自己显现</td><td>41、46、47、54-55</td></tr>'+
  '<tr><td><b>③ 选项反代</b></td><td>问「可能为真」时，把每个选项代进条件试，比正向推快 3 倍</td><td>43、44、48-50</td></tr>'+
  '<tr><td><b>④ 先「可能」后「一定」</b></td><td>一拖多里两小题性质不同：可能为真范围大、好排除；一定为真范围小、要推导。<b>顺序反了会白耗时间</b></td><td>48-50、52-53</td></tr></table>'+
  '<div class="warnbox"><b>最容易犯的错：</b>第一小题用过的临时假设，带到第二小题。<b>除非题干明说「共用条件」，否则每问重新落表。</b>本卷 54-55 就是典型——两问的条件不一样。</div></div>';

 h+='<div class="card"><h3 style="margin-top:0">(b) 一周练熟的清单（每天 25 分钟）</h3>'+
  '<table class="tbl"><tr><th style="width:14%">天</th><th style="width:26%">题型</th><th>练什么 / 练到什么程度</th></tr>'+
  '<tr><td>D1–D2</td><td><b>排位</b>（线性）</td><td>五个位置一条轴，先填「一定在哪」，再处理「相邻/隔一个」。标准：<b>6 分钟内做完一拖二</b>。</td></tr>'+
  '<tr><td>D3</td><td><b>匹配</b>（人–物二维表）</td><td>五人五物的表，逐格标 √/×/?。标准：<b>看到「只有…才」「不…就不…」能立刻落格</b>。</td></tr>'+
  '<tr><td>D4</td><td><b>分组</b>（三组非空）</td><td>「每组至少 1 个」当计数器；先找数量矛盾。标准：<b>能一眼看出哪两条说法互斥</b>。</td></tr>'+
  '<tr><td>D5</td><td><b>一拖多</b>（共用材料）</td><td>先做「可能为真」，再做「一定为真」；每问重新落表。标准：<b>一组 3 小题 ≤ 9 分钟</b>。</td></tr>'+
  '<tr><td>D6</td><td><b>组合 / 七选三</b></td><td>先列互斥对，再用「至多/至少」剪枝。标准：<b>能写出候选集而不是逐个试</b>。</td></tr>'+
  '<tr><td>D7</td><td><b>混合限时</b></td><td>17 题按考场节奏走一遍（40 分钟），只统计「超时题」是哪一类。</td></tr></table>'+
  '<div class="okbox"><b>为什么这 3 类能一周练熟：</b>它们的输入输出完全固定——给条件、填表、输出唯一解。'+
  '而论证题（支持/削弱/假设）练的是「找缺口」，那是指向性判断，一周练不出稳定手感。<b>所以顺序是：先把分析推理练到机械，再回头补论证。</b></div></div>';

 h+='<div class="card"><h3 style="margin-top:0">论证 5 题（32/33/34/37/38）怎么办</h3>'+
  '<ul class="tight">'+
  '<li><b>削弱题（32、34、38）</b>：找结论的机制链，<b>量化否定 &gt; 「可能有风险」</b>。三个选项一般都能排除，因为有「换个主体」「诉诸权威」这类硬伤。</li>'+
  '<li><b>假设题（33、37）</b>：把选项<b>取反</b>代回题干，结论塌掉的才是答案。不要问「它是否合理」，要问「没有它行不行」。</li>'+
  '<li>时间：单题 2 分钟，找不到缺口就标记跳过——论证题一旦纠结，正确率反而下降。</li></ul></div>';
 return h;
};

TABS.map=function(){
 var h='<div class="card"><span class="qtag">逐题地图</span>'+
  '<h2 style="margin-top:10px">数学 25 题：考点 / 档位 / 我的答案 / 一句话动作</h2>'+
  '<div class="note" style="margin-bottom:8px"><span class="pill tA">A 必拿</span> <span class="pill tB">B 可选</span> <span class="pill tC">C 该跳</span>　「我推」＝我独立算出的答案，以官方解析为准。</div>'+
  '<table class="tbl"><tr><th style="width:6%">题</th><th style="width:22%">考点</th><th style="width:8%">档</th><th style="width:12%">我推</th><th>动作</th></tr>'+
  MAT.map(function(r){return '<tr><td><b>'+r.n+'</b></td><td>'+r.kp+'</td><td><span class="pill t'+r.t+'">'+r.t+'</span></td><td>'+r.ans+'</td><td>'+r.act+'</td></tr>';}).join('')+
  '</table></div>';

 h+='<div class="card"><h3 style="margin-top:0">论证逻辑 5 题</h3>'+
  '<table class="tbl"><tr><th style="width:8%">题</th><th style="width:20%">题型</th><th style="width:8%">档</th><th>动作</th></tr>'+
  LG.map(function(r){return '<tr><td><b>'+r.n+'</b></td><td>'+r.kp+'</td><td><span class="pill t'+r.t+'">'+r.t+'</span></td><td>'+r.act+'</td></tr>';}).join('')+
  '</table></div>';

 h+='<div class="card"><h3 style="margin-top:0">分析推理 17 题（39–55）</h3>'+
  '<table class="tbl"><tr><th style="width:12%">题</th><th style="width:22%">类型</th><th style="width:8%">档</th><th>动作</th></tr>'+
  LY.map(function(r){return '<tr><td><b>'+r.n+'</b></td><td>'+r.type+'</td><td><span class="pill t'+r.t+'">'+r.t+'</span></td><td>'+r.act+'</td></tr>';}).join('')+
  '</table>'+
  '<div class="note">统计：排位 6 题、匹配 5 题、分组 2 题、一拖二/三 4 组 9 题。<b>三类模板覆盖全部 17 题</b>——这就是为什么分析推理能一周练熟。</div></div>';

 h+='<div class="card"><h3 style="margin-top:0">这张卷子暴露的三件事</h3>'+
  '<ul class="tight">'+
  '<li><b>你的条件充分性正确率比问题求解低。</b>卷面看，20、23、25 都是 A 档但你标得犹豫——说明缺的不是知识，是「先单独试、再联立」这个顺序。</li>'+
  '<li><b>第 7 题你选了 1/3。</b>如果题干问的是「整个赛程相遇」，答案应该是 1/2（首轮 1/3 + 决赛 1/6）。这题值得回看题干原文——<b>这类「是否包含决赛」的歧义，是概率题最常见的失分点</b>。</li>'+
  '<li><b>第 8 题你选了 m&lt;9。</b>区间是开区间，端点取不到，所以 m=9 也成立 → 应该是 m≤9。<b>「端点开闭」是 M8 唯一的高频陷阱</b>，下次先问一句「端点能不能取」。</li></ul>'+
  '<div class="note">以上三条都是从你的卷面标注读出来的，如果我看错了你的圈选，告诉我改。</div></div>';
 return h;
};

var view=document.getElementById('view');
function setTab(t){
 [].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){ b.classList.toggle('on', b.dataset.t===t); });
 view.innerHTML=TABS[t]();
 window.scrollTo(0,0);
}
[].slice.call(document.querySelectorAll('#tabs button')).forEach(function(b){ b.onclick=function(){ setTab(b.dataset.t); }; });
setTab('score');
</script>
</body></html>
